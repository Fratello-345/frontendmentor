<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Blog preview card</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <article class="card">
        <img
          class="card_image"
          src="assets/images/illustration-article.svg"
          alt="Image"
        />

        <div class="card_bage">Learning</div>

        <div class="card_date">Published 21 Dec 2023</div>

        <h2 class="card_heading">HTML & CSS foundations</h2>

        <p class="card_text">
          These languages are the backbone of every website, defining structure,
          content, and presentation.
        </p>

        <div class="card_footer">
          <img
            class="card_avatar"
            src="assets/images/image-avatar.webp"
            alt="avatar image"
          />
          <span class="card_author">Greg Hooper</span>
        </div>
      </article>
    </main>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by
      <a href="https://www.frontendmentor.io/profile/Fratello-345"
        >@Fratello-345</a
      >
    </footer>
  </body>
</html>
